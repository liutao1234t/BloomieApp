name: Deploy H5 preview

on:
  push:
    branches: [main]
    paths:
      - "h5/**"
      - ".github/workflows/deploy-h5-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h5-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: h5/package-lock.json

      - name: Build H5 for /preview/
        working-directory: h5
        run: |
          npm ci
          npm run build:preview

      - name: Stage preview folder
        run: |
          rm -rf preview
          mkdir preview
          cp -R h5/dist/. preview/
          touch preview/.nojekyll

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          if git diff --staged --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "Publish H5 preview to /preview/"
          git push
